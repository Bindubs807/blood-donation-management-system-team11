<!DOCTYPE html>
<html>
<head>
    <title>Registration Page</title>
</head>

<body style="margin:0; padding:0; font-family:Arial, sans-serif; background-color:#f2f2f2;">

    <div style="width:400px; margin:50px auto; padding:30px; background-color:white; 
                border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.2);">

        <h2 style="text-align:center; color:#333; margin-bottom:25px;">
            Registration
        </h2>

        <form>

            <label style="display:block; margin-bottom:5px; color:#333;">
                Full Name
            </label>
            <input type="text" placeholder="Enter your name"
                   style="width:100%; padding:10px; margin-bottom:15px; 
                          border:1px solid #ccc; border-radius:5px; box-sizing:border-box;">

            <label style="display:block; margin-bottom:5px; color:#333;">
                Email
            </label>
            <input type="email" placeholder="Enter your email"
                   style="width:100%; padding:10px; margin-bottom:15px; 
                          border:1px solid #ccc; border-radius:5px; box-sizing:border-box;">

            <label style="display:block; margin-bottom:5px; color:#333;">
                Phone Number
            </label>
            <input type="tel" placeholder="Enter phone number"
                   style="width:100%; padding:10px; margin-bottom:15px; 
                          border:1px solid #ccc; border-radius:5px; box-sizing:border-box;">

            <label style="display:block; margin-bottom:5px; color:#333;">
                Password
            </label>
            <input type="password" placeholder="Enter password"
                   style="width:100%; padding:10px; margin-bottom:15px; 
                          border:1px solid #ccc; border-radius:5px; box-sizing:border-box;">

            <label style="display:block; margin-bottom:5px; color:#333;">
                Confirm Password
            </label>
            <input type="password" placeholder="Confirm password"
                   style="width:100%; padding:10px; margin-bottom:20px; 
                          border:1px solid #ccc; border-radius:5px; box-sizing:border-box;">

            <button type="submit"
                    style="width:100%; padding:12px; background-color:#007bff; 
                           color:white; border:none; border-radius:5px; 
                           font-size:16px; cursor:pointer;">
                Register
            </button>

        </form>
    </div>

</body>
</html>
